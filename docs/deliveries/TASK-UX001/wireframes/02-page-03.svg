<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000">
<title>用户手动记录</title><desc>设计评审专用，未接真实后端</desc>
<rect width="1200" height="1000" fill="#eee"/>
<style>text{font-family:Microsoft YaHei,SimHei,sans-serif;fill:#222}</style>
<text x="32" y="47" font-size="28">UX001 / 02  用户手动记录</text>
<text x="32" y="89" font-size="18">PAGE-03 · 设计评审专用 · 未接真实后端 · 视觉未批准 · 示例均虚构</text>
<rect x="32" y="122" width="770" height="760" fill="white" stroke="#444"/>
<rect x="32" y="122" width="770" height="48" fill="#ccc"/>
<text x="48" y="153" font-size="20">GYM  /  用户手动记录</text>
<rect x="32" y="170" width="144" height="712" fill="#ddd"/>
<rect x="44" y="194" width="120" height="44" fill="#aaa" stroke="#999"/>
<text x="56" y="223" font-size="18">首页</text>
<rect x="44" y="256" width="120" height="44" fill="#eee" stroke="#999"/>
<text x="56" y="285" font-size="18">记录</text>
<rect x="44" y="318" width="120" height="44" fill="#eee" stroke="#999"/>
<text x="56" y="347" font-size="18">门店</text>
<rect x="44" y="380" width="120" height="44" fill="#eee" stroke="#999"/>
<text x="56" y="409" font-size="18">我的</text>
<rect x="194" y="190" width="590" height="205" fill="#fafafa" stroke="#aaa"/>
<text x="208" y="219" font-size="20">类型及输入</text>
<rect x="204" y="232" width="570" height="31" fill="white" stroke="#bbb"/>
<text x="208" y="254" font-size="18">[体重与目标] [饮食] [训练]</text>
<rect x="204" y="271" width="570" height="31" fill="white" stroke="#bbb"/>
<text x="208" y="293" font-size="18">日期时间：[待填] 单位：[按类别]</text>
<rect x="204" y="310" width="570" height="31" fill="white" stroke="#bbb"/>
<text x="208" y="332" font-size="18">数值：[待填]  字段错误就近显示</text>
<rect x="194" y="412" width="590" height="205" fill="#fafafa" stroke="#aaa"/>
<text x="208" y="441" font-size="20">记录内容</text>
<text x="208" y="476" font-size="18">身高 / 体脂 / 围度与体重趋势</text>
<text x="208" y="515" font-size="18">食物分量及营养素汇总；训练内容时长</text>
<text x="208" y="554" font-size="18">手动训练不能确认个人榜有效日</text>
<rect x="194" y="634" width="590" height="205" fill="#fafafa" stroke="#aaa"/>
<text x="208" y="663" font-size="20">保存与返回</text>
<rect x="204" y="676" width="570" height="31" fill="white" stroke="#bbb"/>
<text x="208" y="698" font-size="18">[保存记录] → 成功后历史趋势</text>
<rect x="204" y="715" width="570" height="31" fill="white" stroke="#bbb"/>
<text x="208" y="737" font-size="18">[历史记录] [返回首页]</text>
<text x="208" y="776" font-size="18">图片识别另走付费草稿确认再保存</text>
<rect x="826" y="122" width="342" height="760" fill="#ddd" stroke="#aaa"/>
<text x="840" y="151" font-size="20">状态变体</text>
<text x="840" y="186" font-size="18">空态：添加第一条；加载保留表单</text>
<text x="840" y="241" font-size="18">失败保草稿重试；401重登后确认</text>
<text x="840" y="296" font-size="18">全付费到期仍可记录及查本人历史</text>
<text x="32" y="921" font-size="18">服务端逐请求校验主体、门店、资源、权益与资料授权；本图不是权限或政策批准</text>
<text x="32" y="960" font-size="18">评审：入口是否清楚、顺序是否合理、失败及到期保留路径是否可达</text>
</svg>
